<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません | Big Club Japan</title>
  <link rel="stylesheet" href="/style.min.css">
  <style>
    .nf-wrap {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .nf-code {
      font-size: 5rem;
      font-weight: 700;
      color: #baf7fa;
      line-height: 1;
      margin: 0 0 10px;
    }
    .nf-title {
      font-size: 1.4rem;
      color: #eaf7fc;
      margin: 0 0 12px;
    }
    .nf-desc {
      color: #abc;
      line-height: 1.8;
      margin: 0 0 30px;
      max-width: 520px;
    }
    @media (max-width: 768px) {
      .nf-code { font-size: 3.5rem; }
      .nf-title { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="nf-wrap">
    <p class="nf-code">404</p>
    <h1 class="nf-title">ページが見つかりませんでした</h1>
    <p class="nf-desc">
      お探しのページは削除されたか、URLが変更された可能性があります。<br>
      トップページから目的のデータを探してみてください。
    </p>
    <a class="support-button" href="/">トップページへ戻る</a>
  </div>
</body>
</html>
